version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanishlab_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VanishLab
      - ENV=development
      - DEBUG=True
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vanishlab
      - POSTGRES_PASSWORD=vanishlab_password
      - POSTGRES_DB=vanishlab_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=vanishlab-media
      - LAMA_MODEL_PATH=/app/models_weights/big-lama.onnx
    volumes:
      - .:/app
      - ./models_weights:/app/models_weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanishlab_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -c 4
    environment:
      - APP_NAME=VanishLab
      - ENV=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vanishlab
      - POSTGRES_PASSWORD=vanishlab_password
      - POSTGRES_DB=vanishlab_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=vanishlab-media
      - LAMA_MODEL_PATH=/app/models_weights/big-lama.onnx
    volumes:
      - .:/app
      - ./models_weights:/app/models_weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanishlab_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vanishlab
      - POSTGRES_PASSWORD=vanishlab_password
      - POSTGRES_DB=vanishlab_db
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=vanishlab-media
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: vanishlab_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=vanishlab
      - POSTGRES_PASSWORD=vanishlab_password
      - POSTGRES_DB=vanishlab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanishlab -d vanishlab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vanishlab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vanishlab_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    container_name: vanishlab_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing localminio/vanishlab-media;
      /usr/bin/mc anonymous set download localminio/vanishlab-media/outputs;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
